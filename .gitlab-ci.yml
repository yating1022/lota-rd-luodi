default:
  image: node:22

stages:
  - deploy

deploy_preview:
  stage: deploy
  interruptible: true
  rules:
    - if: '$VERCEL_TOKEN && $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH'
  script:
    - npm install --global vercel@latest
    - vercel pull --yes --environment=preview --token=$VERCEL_TOKEN
    - vercel build --token=$VERCEL_TOKEN
    - vercel deploy --prebuilt --token=$VERCEL_TOKEN -m gitlabDeployment="1" -m gitlabCommitRef="$CI_COMMIT_BRANCH"

deploy_production:
  stage: deploy
  interruptible: false
  rules:
    - if: '$VERCEL_TOKEN && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - npm install --global vercel@latest
    - vercel pull --yes --environment=production --token=$VERCEL_TOKEN
    - vercel build --prod --token=$VERCEL_TOKEN
    - vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN -m gitlabDeployment="1" -m gitlabCommitRef="$CI_COMMIT_BRANCH"
